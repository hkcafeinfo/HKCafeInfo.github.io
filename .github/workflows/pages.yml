name: Publish HKCafeInfo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare public site
        run: |
          mkdir -p _site/data _site/web
          cp index.html _site/index.html
          cp data/roster-index.js _site/data/roster-index.js
          cp -R data/roster-parts _site/data/
          cp -R data/profile_images data/event_images _site/data/
          if [ -d data/cancellation_images ]; then cp -R data/cancellation_images _site/data/; fi
          cp web/app.js web/shared.js web/matrix.js web/loading.js web/style.css web/closed_illustration.png _site/web/
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
