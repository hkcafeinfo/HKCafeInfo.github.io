<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Cafe跑店仔 · 香港 MaidCafe 更表</title>
  <script src="web/theme.js?v=44f2836eca885ef4"></script>
  <link rel="stylesheet" href="web/style.css?v=8ebb743bb3560d6f">
  <script src="data/roster-index.js?v=acd84ad6c98d56c6" defer></script>
  <script src="web/loading.js?v=0f67ea14d48057d5" defer></script>
  <script src="web/shared.js?v=fc44aaed9f8214e7" defer></script>
  <script src="web/app.js?v=33b1c5d6e8974342" defer></script>
  <script src="web/matrix.js?v=a9f51e35ae6434cf" defer></script>
  <link rel="stylesheet" href="web/hybrid.css?v=9c05303033add967">
  <link rel="stylesheet" href="web/theme.css?v=f587464a60c4e552">
<script src="web/hybrid-data.js?v=671c5dbfb6d9b4e3" defer></script><script src="web/hybrid.js?v=4b42de76fbba3763" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar"><div class="hero-art hero-logo-collage" id="hero-logos" aria-hidden="true"></div><a class="hybrid-brand" href="https://www.instagram.com/hkcafeinfo/" target="_blank" rel="noopener noreferrer" aria-label="Cafe跑店仔 · ig @hkcafeinfo（另開分頁）"><span class="hybrid-brand-mark" aria-hidden="true"><svg viewBox="0 0 64 64" width="30" height="30" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 29h31v9c0 9-6 14-15 14s-16-5-16-14v-9Z"/><path d="M45 32h5c7 0 6 11-5 11"/><path d="M17 54h29"/><path d="M32 30 27 25c-3-3-6 1-3 4l8 8 8-8c3-3 0-7-3-4Z"/></svg></span><span class="hybrid-brand-copy"><strong>Cafe跑店仔</strong><small><svg class="hybrid-instagram-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg><span>@hkcafeinfo</span></small></span></a><nav class="hybrid-header-nav" aria-label="主要導覽"></nav></header>

    <main>
      <div class="content-layout">
      <aside class="cafe-sidebar" id="cafe-sidebar" aria-labelledby="cafe-sidebar-heading" hidden>
        <div class="sidebar-heading"><h2 id="cafe-sidebar-heading">選擇店舖</h2><span id="visible-shop-count"></span></div>
        <p>勾選要放入卡片同總表嘅店舖。</p>
        <div class="sidebar-actions"><button type="button" id="select-all-shops">全部顯示</button><button type="button" id="select-top-shops">恢復預設</button></div>
        <div id="cafe-checklist" class="cafe-checklist" role="group" aria-label="選擇顯示店舖"></div>
      </aside>
      <div class="content-main">
      <div class="view-controls"><label class="hybrid-search-field"><span aria-hidden="true">⌕</span><input id="hybrid-search" type="search" placeholder="搜尋女僕、店舖或活動…" aria-label="搜尋女僕、店舖或活動" autocomplete="off"></label>
        <button id="toggle-cafe-sidebar" class="sidebar-toggle" type="button" aria-controls="cafe-sidebar" aria-expanded="false">☰ 篩選店舖 <span id="sidebar-toggle-count"></span></button>
        <label class="field search-field global-search"><span class="field-icon" aria-hidden="true">⌕</span><span class="sr-only">搜尋人名或店舖名稱</span><input id="name-search" type="search" placeholder="搜尋人名或店舖名稱…" autocomplete="off"></label>
        <label class="field search-field global-search shop-search"><span class="field-icon" aria-hidden="true">⌕</span><span class="sr-only">搜尋店名或地址</span><input id="shop-search" type="search" placeholder="搜尋店名或地址…"></label>
        <div class="view-switch" role="group" aria-label="選擇顯示方式"><button id="show-cards" type="button" class="view-button" aria-pressed="false">日表</button><button id="show-matrix" type="button" class="view-button active" aria-pressed="true">列表</button><button id="show-events" type="button" class="view-button" aria-pressed="false">活動</button><button id="show-people" type="button" class="view-button" aria-pressed="false">女僕</button><button id="show-shops" type="button" class="view-button" aria-pressed="false">店舖</button></div>
      </div>

      <section id="hybrid-search-results" class="hybrid-inline-section" hidden></section><section id="hybrid-extra-view" class="hybrid-inline-section" hidden></section><section class="roster-section" id="card-view" aria-labelledby="roster-heading">
        <div class="section-topline"><div><span class="section-kicker">EXPLORE THE SCHEDULE</span><h2 id="roster-heading">每日更表</h2></div><div class="card-range-controls"><div class="range-toggle" id="card-date-range" role="group" aria-label="每日更表日期範圍"><button type="button" class="range-toggle-button" data-range="all" aria-pressed="false">所有更表</button><button type="button" class="range-toggle-button" data-range="future" aria-pressed="true">接下來的更表</button></div><span class="result-count" id="result-count"></span></div></div>
        <div class="date-selector-wrap" id="date-selector-wrap"><div class="hybrid-date-control" data-date-control="cards"></div>
          <div class="date-bar" id="date-bar" role="group" aria-label="選擇日期"></div>
          <button type="button" class="date-scroll-button date-scroll-prev" id="date-scroll-prev" aria-label="向左捲動日期" title="向左捲動" hidden>‹</button>
          <button type="button" class="date-scroll-button date-scroll-next" id="date-scroll-next" aria-label="向右捲動日期" title="向右捲動" hidden>›</button>
        </div>
        <div class="roster-grid" id="roster-grid" aria-live="polite"></div>
      </section>

      <section class="events-section" id="events-view" hidden aria-labelledby="events-heading"><div class="section-topline"><div><span class="section-kicker">EVENTS</span><h2 id="events-heading">活動</h2></div></div><div class="events-controls-row"><div class="range-toggle" id="events-date-range" role="group" aria-label="活動日期範圍"><button type="button" class="range-toggle-button" data-range="all" aria-pressed="false">所有活動</button><button type="button" class="range-toggle-button active" data-range="future" aria-pressed="true">接下來的活動</button></div><div class="fold-controls"><div class="range-toggle" id="events-fold-controls" role="group" aria-label="活動店舖摺疊"><button type="button" class="range-toggle-button" data-fold="closed" aria-pressed="false">全部摺疊</button><button type="button" class="range-toggle-button" data-fold="open" aria-pressed="false">全部展開</button></div></div></div><div id="events-list"></div></section>

      <section class="shops-section" id="shops-view" aria-labelledby="shops-heading" hidden>
        <div class="section-topline"><div><span class="section-kicker">CAFES INFO</span><h2 id="shops-heading">店舖</h2></div><span id="shops-count" class="result-count"></span></div>
        <p class="shops-help">營業時間以店舖公告為準；特別活動及公眾假期可能另有安排。</p>
        <div id="shop-directory" class="shop-directory"></div>
      </section>

      <section class="people-section" id="people-view" aria-labelledby="people-heading" hidden>
        <div class="section-topline"><div><span class="section-kicker">MAIDS INFO</span><h2 id="people-heading">女僕</h2></div><span class="result-count" id="people-count"></span></div>
        <div class="people-controls-row">
          <p class="people-help">撳人名查看已收錄嘅當值日期同店舖。</p>
          <button type="button" id="export-feedback">匯出回報 CSV</button>
          <div class="fold-controls"><div class="range-toggle" id="people-fold-controls" role="group" aria-label="女僕店舖摺疊"><button type="button" class="range-toggle-button" data-fold="closed" aria-pressed="false">全部摺疊</button><button type="button" class="range-toggle-button" data-fold="open" aria-pressed="false">全部展開</button></div></div>
        </div>
        <div id="people-list" class="people-list"></div>
      </section>

      <section class="matrix-section" id="matrix-view" aria-labelledby="matrix-heading" hidden>
        <div class="section-topline"><div><span class="section-kicker">ALL CAFES · ONE TABLE</span><h2 id="matrix-heading">各店更表</h2></div><span class="result-count" id="matrix-result-count"></span></div>
        <div class="matrix-controls-row"><div class="hybrid-date-control" data-date-control="matrix"></div>
          <div class="matrix-filter-controls">
          <div class="range-toggle" id="date-range" role="group" aria-label="總表日期範圍"><button type="button" class="range-toggle-button" data-range="all" aria-pressed="false">所有更表</button><button type="button" class="range-toggle-button" data-range="future" aria-pressed="true">接下來的更表</button></div>
          <div class="axis-switch" role="group" aria-label="總表方向"><button id="dates-across" type="button" class="axis-button active" aria-pressed="true">日期橫排</button><button id="shops-across" type="button" class="axis-button" aria-pressed="false">店舖橫排</button></div>
          </div>
          <button type="button" id="person-back" class="person-back" hidden>← 返回</button>
          <div class="matrix-navigation"><span id="scroll-hint">左右捲動查看更多日期</span><button type="button" id="matrix-prev" aria-label="上一欄">←</button><button type="button" id="matrix-next" aria-label="下一欄">→</button></div>
        </div>
        <div class="matrix-viewport" id="matrix-viewport" role="region" aria-label="完整更表，可橫向捲動" tabindex="0"><div id="roster-matrix" class="roster-matrix" aria-live="polite"></div></div>
      </section>

      </div></div>
    </main>
    <footer class="hybrid-footer"><p>資料由公開公告整理。有更表唔代表全日當值；未有資料亦唔代表休息。營業、個人時段及臨時安排，請以店舖最新公告為準。</p><p>HKCafeInfo · 最後更新：2026-11-05</p></footer>
  </div>

<nav class="hybrid-bottom-nav" aria-label="主要導覽"></nav><div class="hybrid-toast" id="hybrid-toast" role="status"></div></body>
</html>
